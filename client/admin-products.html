<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AnishMart - Manage Products</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f6fa;
    color:#222;
    overflow-x:hidden;
}

html{
    scroll-behavior:smooth;
}

/* HEADER */

header{
    background:#131921;
    color:white;
    padding:18px 28px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

header h1{
    font-size:24px;
}

.header-actions{
    display:flex;
    gap:10px;
}

.header-btn{
    border:none;
    background:white;
    color:#131921;

    padding:10px 15px;
    border-radius:8px;

    font-weight:bold;
    cursor:pointer;

    transition:
        transform .18s ease,
        box-shadow .18s ease;
}

.header-btn:hover{
    transform:translateY(-1px);
    box-shadow:0 4px 12px rgba(0,0,0,.15);
}

/* CONTAINER */

.container{
    max-width:1200px;
    margin:30px auto;
    padding:0 20px;
}

/* SECTION */

.section{
    background:white;
    padding:24px;

    border-radius:14px;

    box-shadow:
        0 4px 16px rgba(0,0,0,.08);

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.section h2{
    margin-bottom:20px;
    font-size:23px;
}

/* SEARCH */

.search-box{
    margin-bottom:20px;
}

.search-box input{
    width:100%;
    padding:12px 14px;

    border:1px solid #ddd;
    border-radius:8px;

    font-size:15px;
    outline:none;

    min-height:46px;

    transition:
        border-color .2s ease,
        box-shadow .2s ease;
}

.search-box input:focus{
    border-color:#ff9900;

    box-shadow:
        0 0 0 3px rgba(255,153,0,.12);
}

/* TABLE */

.table-wrapper{
    overflow-x:auto;
    border-radius:9px;
    -webkit-overflow-scrolling:touch;
}

table{
    width:100%;
    min-width:850px;

    border-collapse:collapse;
    background:white;
}

th,
td{
    padding:13px 10px;
    text-align:left;

    border-bottom:1px solid #eee;
    vertical-align:middle;
}

th{
    background:#f5f6f8;
    color:#333;

    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.3px;
}

tbody tr{
    transition:background .15s ease;
}

tbody tr:hover{
    background:#fffaf2;
}

/* STATUS */

.status{
    display:inline-block;

    padding:6px 10px;
    border-radius:20px;

    font-size:12px;
    font-weight:bold;

    white-space:nowrap;
}

.active{
    background:#d4edda;
    color:#155724;
}

.inactive{
    background:#f8d7da;
    color:#721c24;
}

/* STOCK */

.stock-low{
    color:#d97706;
    font-weight:bold;
}

.stock-out{
    color:#d93025;
    font-weight:bold;
}

/* DELETE BUTTON */

.delete-btn{
    border:none;

    background:#ffe7e7;
    color:#d93025;

    padding:8px 12px;
    min-height:38px;

    border-radius:7px;

    cursor:pointer;
    font-weight:bold;

    transition:
        transform .18s ease,
        box-shadow .18s ease,
        background .18s ease;
}

.delete-btn:hover:not(:disabled){
    background:#ffd2d2;

    transform:translateY(-1px);

    box-shadow:
        0 4px 10px rgba(217,48,37,.15);
}

.delete-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* MESSAGE */

#message{
    margin-top:18px;
    font-weight:bold;
}

/* TABLET */

@media(max-width:900px){

    .container{
        width:94%;
        padding:0;
        margin:24px auto;
    }

    .section{
        padding:20px;
    }

    table{
        min-width:800px;
    }
}

/* MOBILE */

@media(max-width:650px){

    header{
        padding:16px;

        flex-direction:column;
        gap:12px;

        text-align:center;
    }

    header h1{
        font-size:21px;
    }

    .header-actions{
        width:100%;
        gap:8px;
    }

    .header-btn{
        flex:1;
        min-height:44px;
        padding:10px;
    }

    .container{
        width:100%;
        padding:0 14px;
        margin:22px auto;
    }

    .section{
        padding:17px 13px;
        border-radius:10px;
    }

    .section h2{
        font-size:20px;
        margin-bottom:16px;
    }

    .search-box{
        margin-bottom:16px;
    }

    .search-box input{
        font-size:16px;
        padding:12px;
    }

    table{
        min-width:720px;
    }

    th,
    td{
        padding:11px 9px;
        font-size:13px;
    }

    .status{
        padding:5px 9px;
        font-size:11px;
    }

    .delete-btn{
        padding:9px 11px;
    }

    #message{
        font-size:14px;
        line-height:1.5;
    }
}

/* SMALL MOBILE */

@media(max-width:380px){

    .container{
        padding:0 10px;
    }

    .section{
        padding:15px 10px;
    }

    header h1{
        font-size:19px;
    }
}

</style>

</head>

<body>

<header>

    <h1>
        ðŸ“¦ Manage Products
    </h1>

    <div class="header-actions">

        <button
            class="header-btn"
            onclick="goDashboard()"
        >
            â† Dashboard
        </button>

        <button
            class="header-btn"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</header>


<div class="container">

    <div class="section">

        <h2>
            All Products
        </h2>


        <!-- SEARCH -->

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search by product name or category..."
                oninput="filterProducts()"
            >

        </div>


        <!-- PRODUCTS TABLE -->

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Product</th>

                        <th>Category</th>

                        <th>Price</th>

                        <th>Stock</th>

                        <th>Status</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody id="productsTableBody">

                    <tr>

                        <td colspan="7">

                            Loading products...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>


        <p id="message"></p>

    </div>

</div>


<script>

/* ==========================================
   ADMIN LOGIN CHECK
========================================== */

let currentUser = null;


try{

    currentUser =
    JSON.parse(
        localStorage.getItem(
            "anishmartUser"
        )
    );

}
catch(error){

    localStorage.removeItem(
        "anishmartUser"
    );

}


if(
    !currentUser ||
    currentUser.role !== "admin"
){

    alert(
        "Admin access only."
    );

    window.location.href =
    "index.html";

}


let allProducts = [];


/* ==========================================
   LOAD PRODUCTS
========================================== */

async function loadProducts(){

    const tableBody =
    document.getElementById(
        "productsTableBody"
    );


    const message =
    document.getElementById(
        "message"
    );


    message.textContent = "";


    try{

        const response =
        await fetch(
            "/api/admin/products"
        );


        const data =
        await response.json();


        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.message ||
                "Unable to load products"
            );

        }


        allProducts =
        Array.isArray(data.products)
        ?
        data.products
        :
        [];


        renderProducts(
            allProducts
        );

    }
    catch(error){

        console.error(
            "LOAD PRODUCTS ERROR:",
            error
        );


        tableBody.innerHTML =
        `
        <tr>

            <td colspan="7">

                Unable to load products.

            </td>

        </tr>
        `;


        message.style.color =
        "#d93025";


        message.textContent =
        error.message;

    }

}


/* ==========================================
   RENDER PRODUCTS
========================================== */

function renderProducts(products){

    const tableBody =
    document.getElementById(
        "productsTableBody"
    );


    if(
        !products ||
        products.length === 0
    ){

        tableBody.innerHTML =
        `
        <tr>

            <td colspan="7">

                No products found.

            </td>

        </tr>
        `;

        return;

    }


    tableBody.innerHTML =
    products

    .map(product => {

        let stockClass = "";


        if(
            Number(product.stock) === 0
        ){

            stockClass =
            "stock-out";

        }
        else if(
            Number(product.stock) <= 5
        ){

            stockClass =
            "stock-low";

        }


        const statusText =
        Number(product.is_active) === 1
        ?
        "Active"
        :
        "Inactive";


        const statusClass =
        Number(product.is_active) === 1
        ?
        "active"
        :
        "inactive";


        const buttonDisabled =
        Number(product.is_active) === 0
        ?
        "disabled"
        :
        "";


        return `
        <tr>

            <td>
                #${escapeHtml(product.id)}
            </td>

            <td>
                <strong>
                    ${escapeHtml(product.name)}
                </strong>
            </td>

            <td>
                ${escapeHtml(
                    product.category || "-"
                )}
            </td>

            <td>

                â‚¹${Number(
                    product.price || 0
                ).toFixed(2)}

            </td>

            <td class="${stockClass}">

                ${escapeHtml(
                    product.stock ?? 0
                )}

            </td>

            <td>

                <span
                    class="status ${statusClass}"
                >

                    ${statusText}

                </span>

            </td>

            <td>

                <button
                    class="delete-btn"
                    onclick="removeProduct(${Number(product.id)})"
                    ${buttonDisabled}
                >

                    Remove

                </button>

            </td>

        </tr>
        `;

    })

    .join("");

}


/* ==========================================
   SEARCH PRODUCTS
========================================== */

function filterProducts(){

    const search =
    document
    .getElementById(
        "searchInput"
    )
    .value
    .toLowerCase()
    .trim();


    const filteredProducts =
    allProducts.filter(
        product => {

            return(

                String(
                    product.name || ""
                )
                .toLowerCase()
                .includes(search)

                ||

                String(
                    product.category || ""
                )
                .toLowerCase()
                .includes(search)

            );

        }
    );


    renderProducts(
        filteredProducts
    );

}


/* ==========================================
   REMOVE PRODUCT
========================================== */

async function removeProduct(productId){

    const confirmed =
    confirm(
        "Remove this product from AnishMart?"
    );


    if(!confirmed){

        return;

    }


    const message =
    document.getElementById(
        "message"
    );


    try{

        const response =
        await fetch(

            `/api/admin/products/${productId}`,

            {
                method:"DELETE"
            }

        );


        const data =
        await response.json();


        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.message ||
                "Unable to remove product"
            );

        }


        message.style.color =
        "#16803a";


        message.textContent =
        data.message ||
        "Product removed successfully âœ…";


        await loadProducts();

    }
    catch(error){

        console.error(
            "REMOVE PRODUCT ERROR:",
            error
        );


        message.style.color =
        "#d93025";


        message.textContent =
        error.message;

    }

}


/* ==========================================
   SAFE TEXT
========================================== */

function escapeHtml(text){

    const div =
    document.createElement(
        "div"
    );


    div.textContent =
    text ?? "";


    return div.innerHTML;

}


/* ==========================================
   DASHBOARD
========================================== */

function goDashboard(){

    window.location.href =
    "admin-dashboard.html";

}


/* ==========================================
   LOGOUT
========================================== */

function logout(){

    localStorage.removeItem(
        "anishmartUser"
    );


    window.location.href =
    "index.html";

}


/* ==========================================
   START
========================================== */

loadProducts();

</script>

</body>
</html>
