<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AnishMart - Orders</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #333;
        }

        header {
            background: white;
            padding: 18px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 15px rgba(0,0,0,.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: #444;
            font-weight: bold;
        }

        nav a:hover {
            color: #667eea;
        }

        .page-header {
            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            color: white;
            text-align: center;
            padding: 55px 20px;
        }

        .page-header h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .page-header p {
            font-size: 17px;
            opacity: .9;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .orders-header,
        .order-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
        }

        .orders-header {
            padding: 25px;
            margin-bottom: 25px;
        }

        .orders-header h2 {
            margin-bottom: 8px;
        }

        .orders-header p {
            color: #777;
        }

        .order-card {
            padding: 25px;
            margin-bottom: 20px;
        }

        .order-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 18px;
            border-bottom: 1px solid #eee;
            gap: 20px;
        }

        .order-number {
            font-size: 21px;
            font-weight: bold;
        }

        .order-date {
            color: #777;
            font-size: 14px;
            margin-top: 7px;
        }

        .order-details {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            padding-top: 22px;
        }

        .detail-box {
            background: #f7f8fc;
            border-radius: 10px;
            padding: 18px;
        }

        .detail-box span.label {
            display: block;
            color: #777;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .detail-box strong {
            font-size: 16px;
        }

        .amount {
            color: #667eea;
            font-size: 18px !important;
        }

        .status {
            display: inline-block;
            padding: 7px 13px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .placed {
            background: #fff3cd;
            color: #856404;
        }

        .processing {
            background: #e2d9ff;
            color: #5b2c83;
        }

        .shipped {
            background: #cce5ff;
            color: #004085;
        }

        .delivered {
            background: #d4edda;
            color: #155724;
        }

        .cancelled,
        .failed {
            background: #f8d7da;
            color: #721c24;
        }

        .pending {
            background: #fff3cd;
            color: #856404;
        }

        .paid {
            background: #d4edda;
            color: #155724;
        }

        .refunded {
            background: #e2e3e5;
            color: #383d41;
        }

        .payment-method {
            display: inline-block;
            background: #eef0ff;
            color: #4d5fc1;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        .delivery-section {
            margin-top: 22px;
            padding-top: 22px;
            border-top: 1px solid #eee;
        }

        .delivery-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .delivery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .delivery-item {
            background: #fafbfe;
            padding: 13px 15px;
            border-radius: 9px;
            border: 1px solid #eee;
        }

        .delivery-item .label {
            display: block;
            font-size: 12px;
            color: #777;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .delivery-item strong {
            font-size: 15px;
        }

        .address-box {
            grid-column: 1 / -1;
        }

        .empty-state,
        .error-state {
            background: white;
            text-align: center;
            padding: 70px 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
        }

        .empty-icon {
            font-size: 70px;
            margin-bottom: 20px;
        }

        .empty-state h2 {
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #777;
            margin-bottom: 25px;
        }

        .shop-btn {
            display: inline-block;
            padding: 13px 25px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .error-state {
            padding: 50px 20px;
            color: #d93025;
        }

        .error-state p {
            margin-top: 10px;
            color: #777;
        }

        footer {
            margin-top: 60px;
            background: #222;
            color: white;
            text-align: center;
            padding: 25px;
        }

        footer p {
            color: #bbb;
        }

        @media(max-width: 950px) {

            .order-details {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media(max-width: 800px) {

            header {
                padding: 15px 25px;
                flex-direction: column;
                gap: 15px;
            }

            nav {
                gap: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .delivery-grid {
                grid-template-columns: 1fr;
            }

            .order-top {
                flex-direction: column;
                align-items: flex-start;
            }

            .address-box {
                grid-column: auto;
            }

        }

        @media(max-width: 550px) {

            .order-details {
                grid-template-columns: 1fr;
            }

        }

    
        /* =========================================
           FINAL MOBILE + UI POLISH
        ========================================== */

        html {
            scroll-behavior: smooth;
        }

        body {
            overflow-x: hidden;
        }

        a, button {
            -webkit-tap-highlight-color: transparent;
        }

        .order-card,
        .detail-box,
        .delivery-item,
        .shop-btn {
            transition:
                transform .2s ease,
                box-shadow .2s ease,
                border-color .2s ease;
        }

        .order-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(0,0,0,.10);
        }

        .shop-btn:hover {
            transform: translateY(-2px);
        }

        @media(max-width: 800px) {
            .container {
                width: 92%;
                margin: 30px auto;
            }

            .page-header {
                padding: 42px 20px;
            }

            .page-header h1 {
                font-size: 34px;
            }

            .orders-header,
            .order-card {
                padding: 21px;
            }
        }

        @media(max-width: 550px) {
            header {
                position: relative;
                padding: 15px 14px;
            }

            .logo {
                font-size: 24px;
            }

            nav {
                width: 100%;
                gap: 8px 14px;
            }

            nav a {
                font-size: 13px;
            }

            .page-header {
                padding: 34px 18px;
            }

            .page-header h1 {
                font-size: 29px;
            }

            .page-header p {
                font-size: 14px;
                line-height: 1.5;
            }

            .container {
                width: 100%;
                padding: 0 14px;
                margin: 24px auto;
            }

            .orders-header {
                padding: 18px;
                margin-bottom: 18px;
                border-radius: 12px;
            }

            .orders-header h2 {
                font-size: 21px;
            }

            .orders-header p {
                font-size: 14px;
            }

            .order-card {
                padding: 18px;
                margin-bottom: 16px;
                border-radius: 12px;
            }

            .order-top {
                gap: 13px;
                padding-bottom: 15px;
            }

            .order-number {
                font-size: 19px;
            }

            .order-date {
                font-size: 13px;
            }

            .order-details {
                gap: 10px;
                padding-top: 17px;
            }

            .detail-box {
                padding: 15px;
            }

            .detail-box strong {
                font-size: 15px;
            }

            .amount {
                font-size: 18px !important;
            }

            .status,
            .payment-method {
                max-width: 100%;
                white-space: normal;
                line-height: 1.35;
            }

            .delivery-section {
                margin-top: 18px;
                padding-top: 18px;
            }

            .delivery-title {
                font-size: 17px;
            }

            .delivery-grid {
                gap: 10px;
            }

            .delivery-item {
                padding: 13px;
                overflow-wrap: anywhere;
            }

            .empty-state,
            .error-state {
                padding: 48px 18px;
                border-radius: 12px;
            }

            .empty-icon {
                font-size: 58px;
            }

            footer {
                margin-top: 40px;
                padding: 22px 15px;
                font-size: 13px;
            }
        }

        @media(max-width: 360px) {
            nav {
                gap: 7px 10px;
            }

            nav a {
                font-size: 12px;
            }

            .page-header h1 {
                font-size: 26px;
            }

            .order-card,
            .orders-header {
                padding: 15px;
            }
        }

</style>

</head>

<body>


<header>

    <div class="logo">
        🛒 AnishMart
    </div>

    <nav>

        <a href="home.html">
            Home
        </a>

        <a href="products.html">
            Products
        </a>

        <a href="cart.html">
            Cart
        </a>

        <a href="orders.html">
            Orders
        </a>

        <a
            href="index.html"
            onclick="logout()"
        >
            Logout
        </a>

    </nav>

</header>



<section class="page-header">

    <h1>
        📦 My Orders
    </h1>

    <p>
        View and track all your AnishMart orders
    </p>

</section>



<div class="container">

    <div id="ordersContent"></div>

</div>



<footer>

    <p>
        © 2026 AnishMart. All Rights Reserved.
    </p>

</footer>



<script>


// ==========================================
// GET LOGGED-IN USER
// ==========================================

const storedUser =
    localStorage.getItem(
        "anishmartUser"
    );


if (!storedUser) {

    alert(
        "Please login to view your orders."
    );

    window.location.href =
        "index.html";

}



let currentUser;


try {

    currentUser =
        JSON.parse(
            storedUser
        );

}
catch (error) {

    localStorage.removeItem(
        "anishmartUser"
    );

    alert(
        "Invalid login session. Please login again."
    );

    window.location.href =
        "index.html";

}



if (
    !currentUser ||
    !currentUser.id ||
    currentUser.role !== "buyer"
) {

    localStorage.removeItem(
        "anishmartUser"
    );

    alert(
        "Buyer login required."
    );

    window.location.href =
        "index.html";

}



const buyerId =
    currentUser.id;


const ordersContent =
    document.getElementById(
        "ordersContent"
    );



// ==========================================
// LOGOUT
// ==========================================

function logout() {

    localStorage.removeItem(
        "anishmartUser"
    );

}



// ==========================================
// FORMAT DATE
// ==========================================

function formatDate(
    dateValue
) {

    const date =
        new Date(
            dateValue
        );


    return date.toLocaleDateString(
        "en-IN",
        {
            day: "2-digit",
            month: "short",
            year: "numeric"
        }
    );

}



// ==========================================
// FORMAT AMOUNT
// ==========================================

function formatAmount(
    amount
) {

    return Number(
        amount
    ).toLocaleString(
        "en-IN",
        {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }
    );

}



// ==========================================
// STATUS CLASS
// ==========================================

function getStatusClass(
    status
) {

    return String(
        status || ""
    )
    .toLowerCase()
    .replace(
        /\s+/g,
        "-"
    );

}



// ==========================================
// SAFE VALUE
// ==========================================

function safe(
    value
) {

    return (
        value === null ||
        value === undefined ||
        value === ""
    )
        ? "Not provided"
        : String(value);

}



// ==========================================
// PAYMENT METHOD DISPLAY
// ==========================================

function getPaymentMethod(
    paymentMethod
) {

    if (
        paymentMethod === "COD"
    ) {

        return "💵 Cash on Delivery";

    }


    if (
        paymentMethod === "ONLINE"
    ) {

        return "💳 Online Payment";

    }


    return "Not provided";

}



// ==========================================
// LOAD ORDERS
// ==========================================

async function loadOrders() {

    try {

        const response =
            await fetch(

                `http://localhost:5000/api/orders/history/${buyerId}`

            );


        const data =
            await response.json();


        if (
            !data.success
        ) {

            throw new Error(

                data.message ||
                "Failed to load orders"

            );

        }



        // NO ORDERS
        if (
            !data.orders ||
            data.orders.length === 0
        ) {

            ordersContent.innerHTML = `

                <div class="empty-state">

                    <div class="empty-icon">
                        📦
                    </div>

                    <h2>
                        No Orders Yet
                    </h2>

                    <p>
                        You haven't placed any orders yet.
                    </p>

                    <a
                        href="products.html"
                        class="shop-btn"
                    >
                        🛍️ Start Shopping
                    </a>

                </div>

            `;


            return;

        }



        let ordersHTML = `

            <div class="orders-header">

                <h2>
                    Your Order History
                </h2>

                <p>

                    ${data.orders.length}

                    order${data.orders.length > 1 ? "s" : ""}

                    found

                </p>

            </div>

        `;



        // ==================================
        // CREATE EACH ORDER CARD
        // ==================================

        data.orders.forEach(
            order => {


                const statusClass =
                    getStatusClass(
                        order.status
                    );


                const paymentClass =
                    getStatusClass(
                        order.payment_status
                    );


                const fullAddress = [

                    safe(order.address),

                    safe(order.city),

                    safe(order.state),

                    safe(order.pincode)

                ].join(", ");



                ordersHTML += `


                    <div class="order-card">


                        <!-- ORDER TOP -->

                        <div class="order-top">


                            <div>

                                <div class="order-number">

                                    📦 Order #${order.id}

                                </div>


                                <div class="order-date">

                                    Ordered on
                                    ${formatDate(
                                        order.created_at
                                    )}

                                </div>

                            </div>



                            <span
                                class=
                                "status ${statusClass}"
                            >

                                ${safe(
                                    order.status
                                )}

                            </span>


                        </div>



                        <!-- ORDER INFORMATION -->

                        <div class="order-details">


                            <!-- TOTAL -->

                            <div class="detail-box">

                                <span class="label">
                                    Total Amount
                                </span>

                                <strong class="amount">

                                    ₹${formatAmount(
                                        order.total_amount
                                    )}

                                </strong>

                            </div>



                            <!-- ORDER STATUS -->

                            <div class="detail-box">

                                <span class="label">
                                    Order Status
                                </span>

                                <span
                                    class=
                                    "status ${statusClass}"
                                >

                                    ${safe(
                                        order.status
                                    )}

                                </span>

                            </div>



                            <!-- PAYMENT METHOD -->

                            <div class="detail-box">

                                <span class="label">
                                    Payment Method
                                </span>

                                <span class="payment-method">

                                    ${getPaymentMethod(
                                        order.payment_method
                                    )}

                                </span>

                            </div>



                            <!-- PAYMENT STATUS -->

                            <div class="detail-box">

                                <span class="label">
                                    Payment Status
                                </span>

                                <span
                                    class=
                                    "status ${paymentClass}"
                                >

                                    ${safe(
                                        order.payment_status
                                    )}

                                </span>

                            </div>


                        </div>



                        <!-- DELIVERY DETAILS -->

                        <div class="delivery-section">


                            <div class="delivery-title">

                                🚚 Delivery Details

                            </div>



                            <div class="delivery-grid">


                                <div class="delivery-item">

                                    <span class="label">

                                        Customer Name

                                    </span>


                                    <strong>

                                        ${safe(
                                            order.customer_name
                                        )}

                                    </strong>

                                </div>



                                <div class="delivery-item">

                                    <span class="label">

                                        Phone

                                    </span>


                                    <strong>

                                        ${safe(
                                            order.phone
                                        )}

                                    </strong>

                                </div>



                                <div
                                    class=
                                    "delivery-item address-box"
                                >

                                    <span class="label">

                                        Delivery Address

                                    </span>


                                    <strong>

                                        ${fullAddress}

                                    </strong>

                                </div>


                            </div>


                        </div>


                    </div>


                `;

            }

        );



        ordersContent.innerHTML =
            ordersHTML;


    }
    catch (error) {


        console.error(
            "LOAD ORDERS ERROR:",
            error
        );


        ordersContent.innerHTML = `

            <div class="error-state">

                <h2>

                    ⚠️ Unable to Load Orders

                </h2>

                <p>

                    Please make sure the AnishMart
                    server is running and try again.

                </p>

            </div>

        `;

    }

}



// ==========================================
// INITIAL LOAD
// ==========================================

loadOrders();



</script>


</body>

</html>
