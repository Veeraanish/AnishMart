<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AnishMart - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        .login-container {
            width: 390px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .logo {
            text-align: center;
            margin-bottom: 10px;
        }

        .logo h1 {
            font-size: 32px;
            color: #667eea;
        }

        .welcome {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .role-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .role-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 22px;
        }

        .role-card {
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 14px 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
        }

        .role-card:hover {
            border-color: #667eea;
            background: #f7f8ff;
        }

        .role-card.active {
            border-color: #667eea;
            background: #eef0ff;
            color: #4f5fd2;
            font-weight: bold;
        }

        .role-card .icon {
            display: block;
            font-size: 26px;
            margin-bottom: 6px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #667eea;
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 70px;
        }

        .show-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #667eea;
            cursor: pointer;
            font-size: 13px;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #5568d8;
        }

        #message,
        #resetMessage {
            text-align: center;
            margin-top: 18px;
            font-weight: bold;
            line-height: 1.4;
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            color: #666;
        }

        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .forgot-link {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 18px;
        }

        .forgot-link button {
            border: none;
            background: none;
            color: #667eea;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .forgot-link button:hover {
            text-decoration: underline;
        }

        #forgotSection {
            display: none;
        }

        .reset-title {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .reset-description {
            text-align: center;
            color: #666;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .back-login {
            text-align: center;
            margin-top: 22px;
        }

        .back-login button {
            border: none;
            background: none;
            color: #667eea;
            font-weight: bold;
            cursor: pointer;
        }

        .back-login button:hover {
            text-decoration: underline;
        }

        @media (max-width: 450px) {
            .login-container {
                width: 100%;
                padding: 30px 22px;
            }
        }
    
        #anishmartInstallBtn {
            display: none;
            width: 100%;
            margin-top: 16px;
            padding: 12px 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg,#667eea,#764ba2);
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(102,126,234,.22);
            transition: transform .18s ease, opacity .18s ease;
        }

        #anishmartInstallBtn:hover {
            opacity: .94;
            transform: translateY(-1px);
        }

</style>

    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#667eea">
    <link rel="apple-touch-icon" href="/images/icon-192.png">

</head>

<body>

    <div class="login-container">

        <div class="logo">
            <h1>🛒 AnishMart</h1>
        </div>


        <!-- ================= LOGIN ================= -->

        <div id="loginSection">

            <p class="welcome">
                Welcome back! Select your account type and login.
            </p>

            <form id="loginForm">

                <div class="role-title">
                    Login As
                </div>

                <div class="role-options">

                    <div
                        id="buyerRole"
                        class="role-card"
                        onclick="selectRole('buyer')"
                    >
                        <span class="icon">🛍️</span>
                        Buyer
                    </div>

                    <div
                        id="sellerRole"
                        class="role-card"
                        onclick="selectRole('seller')"
                    >
                        <span class="icon">🏪</span>
                        Seller
                    </div>

                    <div
                        id="adminRole"
                        class="role-card"
                        onclick="selectRole('admin')"
                    >
                        <span class="icon">👑</span>
                        Admin
                    </div>

                </div>


                <input
                    type="hidden"
                    id="loginRole"
                >


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword()"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- FORGOT PASSWORD LINK -->

                <div class="forgot-link">

                    <button
                        type="button"
                        onclick="showForgotPassword()"
                    >
                        Forgot Password?
                    </button>

                </div>


                <button
                    type="submit"
                    class="login-btn"
                >
                    Login
                </button>

            </form>


            <p id="message"></p>


            <div class="register-link">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </div>


            <button
                id="anishmartInstallBtn"
                type="button"
                onclick="installAnishMart()"
            >
                📲 Install AnishMart App
            </button>

        </div>



        <!-- ================= FORGOT PASSWORD ================= -->

        <div id="forgotSection">

            <h2 class="reset-title">
                🔐 Reset Password
            </h2>

            <p class="reset-description">
                Enter your registered email and choose a new password.
            </p>


            <form id="forgotForm">


                <div class="form-group">

                    <label for="resetEmail">
                        Registered Email
                    </label>

                    <input
                        type="email"
                        id="resetEmail"
                        placeholder="Enter your registered email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="newPassword">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Minimum 6 characters"
                        minlength="6"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Enter new password again"
                        minlength="6"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn"
                >
                    Reset Password
                </button>

            </form>


            <p id="resetMessage"></p>


            <div class="back-login">

                <button
                    type="button"
                    onclick="showLogin()"
                >
                    ← Back to Login
                </button>

            </div>

        </div>

    </div>



    <script>

        /* ==========================
           ROLE SELECTION
        ========================== */

        function selectRole(role) {

            document.getElementById("loginRole").value = role;

            document
                .getElementById("buyerRole")
                .classList.remove("active");

            document
                .getElementById("sellerRole")
                .classList.remove("active");

            document
                .getElementById("adminRole")
                .classList.remove("active");


            if (role === "buyer") {

                document
                    .getElementById("buyerRole")
                    .classList.add("active");

            } else if (role === "seller") {

                document
                    .getElementById("sellerRole")
                    .classList.add("active");

            } else if (role === "admin") {

                document
                    .getElementById("adminRole")
                    .classList.add("active");

            }
        }



        /* ==========================
           SHOW PASSWORD
        ========================== */

        function togglePassword() {

            const password =
                document.getElementById("password");

            const button =
                document.querySelector(".show-password");


            if (password.type === "password") {

                password.type = "text";
                button.textContent = "Hide";

            } else {

                password.type = "password";
                button.textContent = "Show";

            }
        }



        /* ==========================
           SHOW FORGOT PASSWORD
        ========================== */

        function showForgotPassword() {

            document
                .getElementById("loginSection")
                .style.display = "none";

            document
                .getElementById("forgotSection")
                .style.display = "block";


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            if (email) {

                document
                    .getElementById("resetEmail")
                    .value = email;

            }


            document
                .getElementById("resetMessage")
                .textContent = "";
        }



        /* ==========================
           BACK TO LOGIN
        ========================== */

        function showLogin() {

            document
                .getElementById("forgotSection")
                .style.display = "none";

            document
                .getElementById("loginSection")
                .style.display = "block";

        }



        /* ==========================
           RESET PASSWORD
        ========================== */

        document
            .getElementById("forgotForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const email =
                        document
                            .getElementById("resetEmail")
                            .value
                            .trim();


                    const newPassword =
                        document
                            .getElementById("newPassword")
                            .value;


                    const confirmPassword =
                        document
                            .getElementById("confirmPassword")
                            .value;


                    const resetMessage =
                        document
                            .getElementById("resetMessage");


                    if (newPassword.length < 6) {

                        resetMessage.style.color =
                            "#d93025";

                        resetMessage.textContent =
                            "Password must be at least 6 characters.";

                        return;
                    }


                    if (
                        newPassword !==
                        confirmPassword
                    ) {

                        resetMessage.style.color =
                            "#d93025";

                        resetMessage.textContent =
                            "Passwords do not match.";

                        return;
                    }


                    resetMessage.style.color =
                        "#667eea";

                    resetMessage.textContent =
                        "Resetting password...";


                    try {

                        const response =
                            await fetch(

                                "/api/users/reset-password",

                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body: JSON.stringify({
                                        email: email,
                                        newPassword: newPassword
                                    })
                                }

                            );


                        const data =
                            await response.json();


                        if (
                            !response.ok ||
                            !data.success
                        ) {

                            resetMessage.style.color =
                                "#d93025";

                            resetMessage.textContent =
                                data.message ||
                                "Password reset failed.";

                            return;
                        }


                        resetMessage.style.color =
                            "#16803a";

                        resetMessage.textContent =
                            "Password reset successfully ✅";


                        setTimeout(
                            function() {

                                document
                                    .getElementById("email")
                                    .value = email;


                                document
                                    .getElementById("password")
                                    .value = "";


                                document
                                    .getElementById("forgotForm")
                                    .reset();


                                showLogin();


                                const message =
                                    document
                                        .getElementById("message");


                                message.style.color =
                                    "#16803a";


                                message.textContent =
                                    "Password changed. Login with your new password.";

                            },
                            1000
                        );


                    } catch (error) {

                        console.error(
                            "RESET PASSWORD ERROR:",
                            error
                        );


                        resetMessage.style.color =
                            "#d93025";


                        resetMessage.textContent =
                            "Unable to connect to server.";

                    }
                }
            );



        /* ==========================
           LOGIN
        ========================== */

        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const selectedRole =
                        document
                            .getElementById("loginRole")
                            .value;


                    const email =
                        document
                            .getElementById("email")
                            .value
                            .trim();


                    const password =
                        document
                            .getElementById("password")
                            .value;


                    const message =
                        document
                            .getElementById("message");


                    if (!selectedRole) {

                        message.style.color =
                            "#d93025";

                        message.textContent =
                            "Please select Buyer or Seller.";

                        return;
                    }


                    message.style.color =
                        "#667eea";

                    message.textContent =
                        "Logging in...";


                    try {

                        const response =
                            await fetch(

                                "/api/users/login",

                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body: JSON.stringify({
                                        email: email,
                                        password: password
                                    })
                                }

                            );


                        const data =
                            await response.json();


                        if (!data.success) {

                            message.style.color =
                                "#d93025";

                            message.textContent =
                                data.message ||
                                "Login failed";

                            return;
                        }


                        if (
                            !data.user ||
                            !data.user.role
                        ) {

                            message.style.color =
                                "#d93025";

                            message.textContent =
                                "Invalid account role.";

                            return;
                        }


                        if (
                            data.user.role !==
                            selectedRole
                        ) {

                            message.style.color =
                                "#d93025";


                            const roleNames = {
                                buyer: "Buyer",
                                seller: "Seller",
                                admin: "Admin"
                            };


                            const actualRole =
                                roleNames[data.user.role] || "Unknown";


                            const selectedRoleName =
                                roleNames[selectedRole] || "Unknown";


                            message.textContent =
                                `This account is registered as ${actualRole}. Please select ${actualRole} Login instead of ${selectedRoleName}.`;

                            return;
                        }


                        localStorage.setItem(
                            "anishmartUser",
                            JSON.stringify(
                                data.user
                            )
                        );


                        message.style.color =
                            "#16803a";


                        message.textContent =
                            "Login successful ✅";


                        setTimeout(
                            () => {

                                if (
                                    data.user.role ===
                                    "admin"
                                ) {

                                    window.location.href =
                                        "admin-dashboard.html";

                                } else if (
                                    data.user.role ===
                                    "seller"
                                ) {

                                    window.location.href =
                                        "seller-dashboard.html";

                                } else {

                                    window.location.href =
                                        "home.html";

                                }

                            },
                            500
                        );


                    } catch (error) {

                        console.error(error);


                        message.style.color =
                            "#d93025";


                        message.textContent =
                            "Unable to connect to server";

                    }
                }
            );

    </script>

<script src="/pwa.js"></script>
</body>

</html>
